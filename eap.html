<script>
/* BUILDLY_ESPACO_PROPRIO — isolamento de localStorage */
(function () {
  var P = 'buildly3::';
  var real;
  try { real = window.localStorage; } catch (e) { return; }
  if (!real || real.__buildly3) return;

  function nossas() {
    var out = [];
    for (var i = 0; i < real.length; i++) {
      var k = real.key(i);
      if (k && k.indexOf(P) === 0) out.push(k);
    }
    return out;
  }

  var espaco = {
    __buildly3: true,
    get length() { return nossas().length; },
    key: function (i) {
      var k = nossas()[i];
      return k === undefined ? null : k.slice(P.length);
    },
    getItem: function (k) { return real.getItem(P + k); },
    setItem: function (k, v) { real.setItem(P + k, v); },
    removeItem: function (k) { real.removeItem(P + k); },
    clear: function () { nossas().forEach(function (k) { real.removeItem(k); }); }
  };

  try {
    Object.defineProperty(window, 'localStorage', {
      value: espaco, configurable: true, writable: false
    });
  } catch (e) {}
})();
</script>
<script>
let todosItens = [];
let itemSelecionado = null;

async function carregarEAP() {
  try {
    if (!window.B3Obras || !window.B3Obras.cliente) {
      return [];
    }
    const cliente = B3Obras.cliente();
    const obraId = B3Obras.atualId();

    const { data, error } = await cliente
      .from('eap_itens')
      .select('*')
      .eq('obra_id', obraId)
      .order('codigo');

    if (error) {
      console.error('Erro ao carregar EAP:', error);
      return [];
    }
    return data || [];
  } catch (e) {
    console.error('Erro ao conectar ao Supabase:', e);
    return [];
  }
}

function renderizarEAP(itens) {
  const tree = document.getElementById('tree');
  tree.innerHTML = '';
  todosItens = itens;

  const nivel = (codigo) => codigo.split('.').length - 1;
  
  const iconePorTipo = {
    'grupo': 'fa-folder',
    'pacote': 'fa-tasks',
    'entrega': 'fa-check-circle',
    'outro': 'fa-file'
  };

  const corProgresso = (perc) => {
    if (perc === 100) return '#4caf50';
    if (perc >= 75) return '#8bc34a';
    if (perc >= 50) return '#ffc107';
    if (perc >= 25) return '#ff9800';
    return '#f44336';
  };

  itens.forEach(item => {
    const div = document.createElement('div');
    div.className = `tree-item level-${nivel(item.codigo)}`;
    div.dataset.itemId = item.id;
    
    const progCor = corProgresso(item.percentual_completo || 0);
    const responsavelAbbr = item.responsavel ? item.responsavel.substring(0, 1).toUpperCase() : '—';
    
    div.innerHTML = `
      <div class="tree-item-header" onclick="selecionarItem(event, '${item.id}')">
        <span class="tree-item-icon"><i class="fas ${iconePorTipo[item.tipo] || 'fa-file'}"></i></span>
        <span class="tree-item-name">${item.nome}</span>
        <span class="tree-item-code">${item.codigo}</span>
        ${item.status ? `<span class="tree-item-status status-${item.status}">${item.status.replace('_', ' ')}</span>` : ''}
        ${item.responsavel ? `<span style="font-size: 10px; background: var(--accent); color: white; padding: 3px 6px; border-radius: 3px; font-weight: 500;">${responsavelAbbr}</span>` : ''}
        <div class="tree-item-actions" onclick="event.stopPropagation()">
          <button class="btn btn-secondary btn-sm" onclick="editarItem('${item.id}')">✎</button>
          <button class="btn btn-danger btn-sm" onclick="removerItem('${item.id}')">✕</button>
        </div>
      </div>
      ${item.percentual_completo ? `
        <div class="tree-item-progress">
          <div class="tree-item-progress-bar" style="width: ${item.percentual_completo}%; background: ${progCor};"></div>
        </div>
      ` : ''}
    `;
    tree.appendChild(div);
  });

  atualizarStats(itens);
  atualizarFiltros(itens);
}

function atualizarStats(itens) {
  document.getElementById('stat-total').textContent = itens.length;
  
  const atrasados = itens.filter(i => i.status === 'atrasado').length;
  document.getElementById('stat-atrasado').textContent = atrasados;
  
  const somaPerc = itens.reduce((sum, i) => sum + (i.percentual_completo || 0), 0);
  const mediaPerc = itens.length > 0 ? Math.round(somaPerc / itens.length) : 0;
  document.getElementById('stat-concluido').textContent = mediaPerc + '%';
}

function atualizarFiltros(itens) {
  const responsaveis = [...new Set(itens.filter(i => i.responsavel).map(i => i.responsavel))];
  const select = document.getElementById('filtro-responsavel');
  const valorAtual = select.value;
  select.innerHTML = '<option value="">Todos</option>';
  responsaveis.sort().forEach(r => {
    select.innerHTML += `<option value="${r}">${r}</option>`;
  });
  select.value = valorAtual;
}

function aplicarFiltros() {
  const statusFiltro = document.getElementById('filtro-status').value;
  const responsavelFiltro = document.getElementById('filtro-responsavel').value;
  
  const itensFiltrados = todosItens.filter(i => {
    const statusOk = !statusFiltro || i.status === statusFiltro;
    const respOk = !responsavelFiltro || i.responsavel === responsavelFiltro;
    return statusOk && respOk;
  });
  
  renderizarEAP(itensFiltrados);
}

function limparFiltros() {
  document.getElementById('filtro-status').value = '';
  document.getElementById('filtro-responsavel').value = '';
  renderizarEAP(todosItens);
}

function selecionarItem(event, itemId) {
  const item = todosItens.find(i => i.id === itemId);
  if (!item) return;
  
  itemSelecionado = item;
  
  const sidebar = document.getElementById('sidebar');
  const diasRestantes = item.data_fim ? Math.ceil((new Date(item.data_fim) - new Date()) / (1000 * 60 * 60 * 24)) : null;
  
  sidebar.innerHTML = `
    <div class="sidebar-title">${item.nome}</div>
    <div class="sidebar-field">
      <div class="sidebar-label">Código</div>
      <div class="sidebar-value">${item.codigo}</div>
    </div>
    <div class="sidebar-field">
      <div class="sidebar-label">Tipo</div>
      <div class="sidebar-value">${item.tipo}</div>
    </div>
    ${item.responsavel ? `
    <div class="sidebar-field">
      <div class="sidebar-label">Responsável</div>
      <div class="sidebar-value">${item.responsavel}</div>
    </div>
    ` : ''}
    <div class="sidebar-field">
      <div class="sidebar-label">Status</div>
      <div class="sidebar-value"><span class="tree-item-status status-${item.status || 'planejado'}">${(item.status || 'planejado').replace('_', ' ')}</span></div>
    </div>
    ${item.percentual_completo ? `
    <div class="sidebar-field">
      <div class="sidebar-label">Progresso</div>
      <div style="background: #f0f0f0; height: 8px; border-radius: 4px; overflow: hidden;">
        <div style="width: ${item.percentual_completo}%; height: 100%; background: ${item.percentual_completo === 100 ? '#4caf50' : '#ffc107'};"></div>
      </div>
      <div style="text-align: right; font-size: 11px; margin-top: 4px;">${item.percentual_completo}%</div>
    </div>
    ` : ''}
    ${item.data_inicio ? `
    <div class="sidebar-field">
      <div class="sidebar-label">Início</div>
      <div class="sidebar-value">${new Date(item.data_inicio).toLocaleDateString('pt-BR')}</div>
    </div>
    ` : ''}
    ${item.data_fim ? `
    <div class="sidebar-field">
      <div class="sidebar-label">Fim previsto</div>
      <div class="sidebar-value">${new Date(item.data_fim).toLocaleDateString('pt-BR')} ${diasRestantes !== null ? `(${diasRestantes > 0 ? diasRestantes + 'd' : 'Vencido'})` : ''}</div>
    </div>
    ` : ''}
    ${item.descricao ? `
    <div class="sidebar-field">
      <div class="sidebar-label">Descrição</div>
      <div class="sidebar-value" style="white-space: pre-wrap; line-height: 1.4;">${item.descricao}</div>
    </div>
    ` : ''}
    <div style="display: flex; gap: 10px; margin-top: 20px;">
      <button class="btn btn-secondary btn-sm" style="flex: 1;" onclick="editarItem('${item.id}')">✎ Editar</button>
      <button class="btn btn-danger btn-sm" style="flex: 1;" onclick="removerItem('${item.id}')">✕ Remover</button>
    </div>
  `;
  
  document.querySelectorAll('.tree-item').forEach(el => el.style.opacity = '1');
  document.querySelector(`[data-item-id="${itemId}"]`).style.opacity = '1';
}

function abrirNovaEAP() {
  document.getElementById('modal').classList.add('active');
  document.getElementById('codigo').focus();
}

function fecharModal() {
  document.getElementById('modal').classList.remove('active');
  document.getElementById('codigo').value = '';
  document.getElementById('nome').value = '';
  document.getElementById('tipo').value = 'pacote';
  document.getElementById('responsavel').value = '';
  document.getElementById('status').value = 'planejado';
  document.getElementById('data_inicio').value = '';
  document.getElementById('data_fim').value = '';
  document.getElementById('percentual_completo').value = '0';
  document.getElementById('descricao').value = '';
  document.getElementById('id_edicao').value = '';
  document.getElementById('modal-header').textContent = 'Nova EAP';
}

async function salvarEAP() {
  const codigo = document.getElementById('codigo').value;
  const nome = document.getElementById('nome').value;
  const tipo = document.getElementById('tipo').value;
  const responsavel = document.getElementById('responsavel').value;
  const status = document.getElementById('status').value;
  const data_inicio = document.getElementById('data_inicio').value;
  const data_fim = document.getElementById('data_fim').value;
  const percentual_completo = parseInt(document.getElementById('percentual_completo').value) || 0;
  const descricao = document.getElementById('descricao').value;
  const idEdicao = document.getElementById('id_edicao').value;

  if (!codigo || !nome) {
    alert('Preencha código e nome');
    return;
  }

  try {
    if (!window.B3Obras || !window.B3Obras.cliente) {
      alert('Sistema não inicializado');
      return;
    }
    const cliente = B3Obras.cliente();
    const obraId = B3Obras.atualId();

    let resp;
    if (idEdicao) {
      resp = await cliente
        .from('eap_itens')
        .update({ codigo, nome, tipo, responsavel, status, data_inicio, data_fim, percentual_completo, descricao, atualizado_em: new Date().toISOString() })
        .eq('id', idEdicao)
        .eq('obra_id', obraId);
    } else {
      resp = await cliente
        .from('eap_itens')
        .insert([{ obra_id: obraId, codigo, nome, tipo, responsavel, status, data_inicio, data_fim, percentual_completo, descricao }]);
    }

    if (resp.error) {
      alert('Erro: ' + resp.error.message);
      return;
    }

    fecharModal();
    const itens = await carregarEAP();
    renderizarEAP(itens);
  } catch (e) {
    alert('Erro ao salvar: ' + e.message);
  }
}

async function removerItem(id) {
  if (!confirm('Remover este item?')) return;

  try {
    if (!window.B3Obras || !window.B3Obras.cliente) {
      alert('Sistema não inicializado');
      return;
    }
    const cliente = B3Obras.cliente();
    const { error } = await cliente.from('eap_itens').delete().eq('id', id);

    if (error) {
      alert('Erro: ' + error.message);
      return;
    }

    itemSelecionado = null;
    document.getElementById('sidebar').innerHTML = '<div class="sidebar-empty"><i class="fas fa-cursor"></i><p>Selecione um item para ver detalhes</p></div>';
    const itens = await carregarEAP();
    renderizarEAP(itens);
  } catch (e) {
    alert('Erro ao remover: ' + e.message);
  }
}

async function editarItem(id) {
  try {
    if (!window.B3Obras || !window.B3Obras.cliente) {
      alert('Sistema não inicializado');
      return;
    }
    const cliente = B3Obras.cliente();
    const obraId = B3Obras.atualId();

    const { data, error } = await cliente
      .from('eap_itens')
      .select('*')
      .eq('id', id)
      .eq('obra_id', obraId)
      .maybeSingle();

    if (error || !data) {
      alert('Erro ao carregar item: ' + (error ? error.message : 'não encontrado'));
      return;
    }

    document.getElementById('id_edicao').value = id;
    document.getElementById('codigo').value = data.codigo || '';
    document.getElementById('nome').value = data.nome || '';
    document.getElementById('tipo').value = data.tipo || 'pacote';
    document.getElementById('responsavel').value = data.responsavel || '';
    document.getElementById('status').value = data.status || 'planejado';
    document.getElementById('data_inicio').value = data.data_inicio || '';
    document.getElementById('data_fim').value = data.data_fim || '';
    document.getElementById('percentual_completo').value = data.percentual_completo || '0';
    document.getElementById('descricao').value = data.descricao || '';
    document.getElementById('modal-header').textContent = 'Editar EAP';
    document.getElementById('modal').classList.add('active');
    document.getElementById('codigo').focus();
  } catch (e) {
    alert('Erro ao editar: ' + e.message);
  }
}

window.addEventListener('DOMContentLoaded', () => {
  if (window.B3Obras) {
    (async () => {
      try {
        const itens = await carregarEAP();
        renderizarEAP(itens);
      } catch (e) {
        console.error('Erro ao carregar EAP:', e);
      }
    })();
  }
});
</script>

  <!-- terreno -->
  <path d="M0 468 Q160 456 330 466 T620 462 T900 468 V520 H0Z" fill="url(#chao)"/>
  <g fill="#0b1427">
    <rect x="86" y="446" width="60" height="22" rx="2"/>
    <rect x="96" y="438" width="34" height="9"/>
    <rect x="320" y="452" width="46" height="16" rx="2"/>

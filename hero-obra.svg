<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" preserveAspectRatio="xMaxYMid slice">
  <defs>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1630"/>
      <stop offset=".42" stop-color="#1b315c"/>
      <stop offset=".68" stop-color="#6d5a72"/>
      <stop offset=".86" stop-color="#e2864a"/>
      <stop offset="1" stop-color="#f7b65d"/>
    </linearGradient>
    <radialGradient id="sol" cx=".72" cy=".83" r=".42">
      <stop offset="0" stop-color="#ffe0a3" stop-opacity=".95"/>
      <stop offset=".35" stop-color="#f8a24f" stop-opacity=".5"/>
      <stop offset="1" stop-color="#f8a24f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chao" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101a2f"/>
      <stop offset="1" stop-color="#070d1b"/>
    </linearGradient>
    <pattern id="trelica" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M0 12L12 0M0 0L12 12" stroke="#08101f" stroke-width="1.5" fill="none"/>
    </pattern>
    <pattern id="trelicaFina" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 8L8 0M0 0L8 8" stroke="#08101f" stroke-width="1.2" fill="none"/>
    </pattern>
  </defs>

  <rect width="900" height="520" fill="url(#ceu)"/>
  <rect width="900" height="520" fill="url(#sol)"/>

  <!-- nuvens finas na luz do poente -->
  <g fill="#f3b06b" opacity=".16">
    <ellipse cx="560" cy="330" rx="190" ry="9"/>
    <ellipse cx="700" cy="300" rx="150" ry="7"/>
    <ellipse cx="470" cy="270" rx="120" ry="6"/>
    <ellipse cx="820" cy="350" rx="130" ry="8"/>
  </g>

  <!-- horizonte distante -->
  <path d="M0 438 L70 428 L120 436 L190 420 L260 434 L330 424 L420 436 L520 426 L610 438 L720 424 L820 436 L900 428 L900 520 L0 520Z" fill="#17203a" opacity=".85"/>

  <!-- estrutura em concreto, obra em andamento -->
  <g fill="#0a1226">
    <rect x="430" y="300" width="300" height="9"/>
    <rect x="430" y="352" width="300" height="9"/>
    <rect x="430" y="404" width="300" height="9"/>
    <rect x="430" y="456" width="300" height="9"/>
    <rect x="436" y="300" width="10" height="170"/>
    <rect x="516" y="300" width="10" height="170"/>
    <rect x="596" y="300" width="10" height="170"/>
    <rect x="676" y="300" width="10" height="170"/>
    <rect x="716" y="300" width="10" height="170"/>
    <rect x="516" y="262" width="210" height="8"/>
    <rect x="522" y="262" width="8" height="42"/>
    <rect x="596" y="262" width="8" height="42"/>
    <rect x="716" y="262" width="8" height="42"/>

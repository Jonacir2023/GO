  <rect x="436" y="300" width="290" height="170" fill="url(#trelicaFina)" opacity=".18"/>

  <!-- guindaste principal -->
  <g fill="#08101f">
    <rect x="640" y="70" width="22" height="400" fill="url(#trelica)"/>
    <rect x="639" y="70" width="2.5" height="400"/>
    <rect x="660" y="70" width="2.5" height="400"/>
    <rect x="392" y="62" width="400" height="18" fill="url(#trelica)"/>
    <rect x="392" y="60" width="400" height="2.5"/>
    <rect x="392" y="79" width="400" height="2.5"/>
    <rect x="662" y="62" width="150" height="12" fill="url(#trelica)"/>
    <path d="M651 18 L612 70 L690 70Z"/>
    <path d="M651 18 L394 64 M651 18 L812 66" stroke="#08101f" stroke-width="1.6" fill="none"/>
    <rect x="618" y="76" width="44" height="24" rx="3"/>
    <rect x="796" y="74" width="30" height="30"/>
    <rect x="470" y="80" width="26" height="9"/>
    <path d="M483 89 V232" stroke="#08101f" stroke-width="1.6"/>

    <rect x="799" y="200" width="1.6" height="270"/>
    <rect x="811" y="200" width="1.6" height="270"/>
    <rect x="720" y="196" width="188" height="10" fill="url(#trelicaFina)"/>
    <path d="M806 160 L788 198 L824 198Z"/>
    <path d="M806 160 L722 198 M806 160 L906 198" stroke="#0d172c" stroke-width="1.2" fill="none"/>
    <path d="M744 206 V270" stroke="#0d172c" stroke-width="1.2"/>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Controle de Custos"/>
<title>Controle de Custos — BUILDLy Premium</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#4a5162;--bg-card:#5a6272;--bg-dark:#3a3f49;--bg-mid:#454c59;
  --ink:#ffffff;--ink-soft:#9aa4b2;--ink-faint:#7b8290;
  --accent:#dda583;--accent2:#89ab9d;--line:#666f80;
  --green:#7cb083;--red:#d98a7c;--blue:#8ea3c9;--yellow:#d9b26a;
  --serif:'Barlow Condensed','Arial Narrow',sans-serif;
  --sans:'Barlow',-apple-system,sans-serif;
  --radius:10px;--shadow:0 2px 12px rgba(0,0,0,.12)
}
html,body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;min-height:100vh;width:100%}
body{max-width:480px;margin:0 auto;padding:0 0 82px 0}

.hdr{background:var(--bg-dark);color:#fff;padding:16px 16px 12px;position:fixed;top:0;left:50%;transform:translateX(-50%);z-index:100;box-shadow:0 3px 16px rgba(0,0,0,.4);border-bottom:3px solid var(--accent);width:100%;max-width:480px}
.hdr-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.hdr-logo{font-family:var(--serif);font-size:26px;font-weight:800;letter-spacing:1px;color:#fff}
.hdr-logo span{color:var(--accent)}
.hdr-date{font-family:var(--serif);font-size:13px;font-weight:600;color:var(--accent2);text-align:right}
.hdr-settings{background:none;border:1px solid rgba(255,255,255,.2);color:#fff;font-size:14px;padding:6px 8px;border-radius:6px;cursor:pointer}
.hdr-settings:hover{background:rgba(255,255,255,.08)}

.tabs{position:fixed;top:80px;left:50%;transform:translateX(-50%);z-index:99;width:100%;max-width:480px;display:flex;overflow-x:auto;gap:0;scrollbar-width:none;border-top:1px solid rgba(255,255,255,.08)}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:none;flex:none;padding:14px 16px;font-family:var(--serif);font-size:14px;font-weight:700;letter-spacing:.5px;color:#fff;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;transition:all .2s}
.tab.active{color:#fff;border-bottom-color:var(--accent)}

.page{display:none;padding:0 16px}
.page.active{display:block;padding-top:140px}

.sec{background:var(--bg-card);border-radius:var(--radius);padding:14px;margin-bottom:14px;box-shadow:var(--shadow);border:1px solid var(--line)}
.sec-title{font-family:var(--serif);font-size:16px;font-weight:700;letter-spacing:.5px;color:#fff;margin-bottom:12px}

.frow{margin-bottom:10px}
.frow label{display:block;font-size:12px;font-weight:600;color:#fff;margin-bottom:4px;letter-spacing:.3px;text-transform:uppercase}
.frow input,.frow select,.frow textarea{width:100%;padding:9px 11px;border:1.5px solid var(--line);border-radius:8px;font-family:var(--sans);font-size:14px;background:#454c59;color:var(--ink);transition:border .2s;outline:none}
.frow input:focus,.frow select:focus,.frow textarea:focus{border-color:var(--accent)}
.frow textarea{resize:vertical;min-height:60px}
.frow-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.frow-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:8px;font-family:var(--serif);font-size:14px;font-weight:700;letter-spacing:.5px;cursor:pointer;border:none;transition:all .18s;text-transform:uppercase}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:#c68f6d}
.btn-secondary{background:var(--bg-dark);color:#fff}
.btn-full{width:100%;justify-content:center;margin-bottom:8px}
.btn-sm{padding:6px 12px;font-size:12px}

.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;font-family:var(--serif);letter-spacing:.4px;text-transform:uppercase}
.badge-red{background:#4a3d3a;color:var(--red)}
.badge-blue{background:#38414f;color:var(--blue)}
.badge-green{background:#384a3d;color:var(--green)}

.notif{position:fixed;top:60px;left:16px;right:16px;padding:12px;border-radius:8px;background:var(--green);color:white;font-size:13px;font-weight:600;z-index:200;display:none}
.notif.show{display:block}

.card{background:#5a6272;border-radius:8px;padding:12px;margin-bottom:10px;box-shadow:0 1px 6px rgba(0,0,0,.08);border:1px solid #454c59}
.card-title{font-family:var(--serif);font-size:15px;font-weight:700;color:var(--ink);margin-bottom:4px}
.card-desc{font-size:12px;color:#fff;margin-bottom:6px}
.card-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.card-footer{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding-top:8px;border-top:1px solid #5a6272;font-size:11px;color:#fff}

.item-row{background:#454c59;padding:10px;border-radius:6px;margin-bottom:8px;border:1px solid var(--line)}
.item-row-header{display:flex;justify-content:space-between;margin-bottom:6px}
.item-row-title{font-weight:700;color:var(--ink)}
.item-row-actions{display:flex;gap:4px}
.item-row-actions button{background:none;border:none;cursor:pointer;font-size:12px;font-weight:700;color:#d98a7c}

.stat-box{background:var(--bg-card);padding:12px;border-radius:8px;margin-bottom:10px;border:1px solid var(--line)}
.stat-label{font-size:11px;color:#fff;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.stat-value{font-family:var(--serif);font-size:24px;font-weight:800;color:var(--accent);margin-top:4px}

table{width:100%;border-collapse:collapse;font-size:12px}
th{background:var(--bg-dark);color:#fff;padding:8px;text-align:left;font-weight:700}
td{padding:8px;border-bottom:1px solid var(--line)}
tr:hover{background:#454c59}

.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:500;overflow-y:auto}
.modal.open{display:flex}
.modal-content{background:#5a6272;border-radius:12px;padding:20px;max-width:90%;max-height:90vh;overflow-y:auto;position:relative;margin:auto}
.modal-close{position:absolute;top:10px;right:10px;background:none;border:none;font-size:24px;cursor:pointer;color:#fff}
.modal-title{font-family:var(--serif);font-size:18px;font-weight:700;margin-bottom:15px}

/* ══════════════════════════════════════════════════════════════
   DESKTOP — acima de 900px o app ocupa a tela em vez de ficar numa
   coluna de 480px (tamanho de celular). No celular nada muda.
   ══════════════════════════════════════════════════════════════ */
/* 860 e nao 900: o iframe pode ficar alguns pixels mais estreito que a
   janela (barra de rolagem, bordas). Com o mesmo numero dos dois lados,
   o app de dentro corria o risco de continuar em formato de celular
   enquanto o de fora ja estava em desktop. */
@media (min-width: 860px) {
  body { max-width: 1100px; }
  .hdr, .tabs { max-width: 1100px !important; }
  .page.active { display: grid; grid-template-columns: repeat(auto-fit, minmax(430px, 1fr)); gap: 0 14px; align-items: start; }
  .page.active > * { max-width: none; }
  .page.active input:not([type="checkbox"]):not([type="radio"]),
  .page.active textarea,
  .page.active select { max-width: 660px; }
  .modal { max-width: 560px; }
}
</style>
</head>

<script>
/* ============================================================
   ESPAÇO PRÓPRIO DO BUILDLy — BUILDLY_ESPACO_PROPRIO

   Todos os apps do usuário são publicados sob a mesma origem
   (https://jonacir2023.github.io). O localStorage é isolado por ORIGEM, não
   por pasta: sem este bloco, o BUILDLy e qualquer outro app publicado na
   mesma conta gravam no mesmo pote, com as mesmas chaves, e um passa a
   enxergar a obra do outro.

   Aqui o BUILDLy passa a ter um espaço fechado, prefixado. O app continua
   usando localStorage como sempre — a tradução é invisível. Nada de fora do
   prefixo é lido, escrito ou apagado, nem mesmo por um clear().

   Precisa rodar ANTES de qualquer outro script tocar no armazenamento.
   ============================================================ */
(function () {
  var P = 'buildly3::';
  var real;
  try { real = window.localStorage; } catch (e) { return; }
  if (!real || real.__buildly3) return;

  function nossas() {
    var out = [];
    for (var i = 0; i < real.length; i++) {
      var k = real.key(i);
      if (k && k.indexOf(P) === 0) out.push(k);
    }
    return out;
  }

  var espaco = {
    __buildly3: true,
    get length() { return nossas().length; },
    key: function (i) {
      var k = nossas()[i];
      return k === undefined ? null : k.slice(P.length);
    },
    getItem: function (k) { return real.getItem(P + k); },
    setItem: function (k, v) { real.setItem(P + k, v); },
    removeItem: function (k) { real.removeItem(P + k); },
    // clear() apaga só o que é do BUILDLy — nunca o armazenamento dos outros
    // apps da mesma origem.
    clear: function () { nossas().forEach(function (k) { real.removeItem(k); }); }
  };

  try {
    Object.defineProperty(window, 'localStorage', {
      value: espaco, configurable: true, writable: false
    });
  } catch (e) {
    // Navegador que não deixa redefinir: melhor seguir com o comportamento
    // antigo do que quebrar o app inteiro.
  }
})();
</script>
<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwrSC_cQQW5IDu7Yrub0wnfMx7aInCX37U3BpiouC0qbFk6qgOwQpJzLXzH1XUX9lGEOA/exec';

const S = {
  get(k) { try { return JSON.parse(localStorage.getItem('custo_' + k)); } catch { return null; } },
  set(k, v) { localStorage.setItem('custo_' + k, JSON.stringify(v)); }
};

let config = S.get('config') || { obra: 'Obra', responsavel: 'Responsável' };
let categorias = S.get('categorias') || ['Material', 'Mão de Obra', 'Aluguel', 'Combustível', 'Outros'];
let notasFiscais = S.get('notasfiscais') || [];
let responsaveis = S.get('responsaveis') || ['Jonacir', 'Aline', 'José'];
let itensTemp = [];
let fotoNFTemp = null;

function comprimirFotoNF(file, maxDim, qualidade) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxDim || h > maxDim) {
          const r = Math.min(maxDim / w, maxDim / h);
          w = Math.round(w * r);
          h = Math.round(h * r);
        }
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', qualidade));
      };
      img.onerror = () => reject(new Error('Imagem inválida'));
      img.src = reader.result;
    };
    reader.onerror = () => reject(new Error('Falha ao ler arquivo'));
    reader.readAsDataURL(file);
  });
}

async function onFotoNFSelecionada(ev) {
  const file = ev.target.files[0];
  ev.target.value = '';
  if (!file) return;
  try {
    fotoNFTemp = await comprimirFotoNF(file, 1280, 0.72);
    renderFotoNFPreview();
  } catch (err) {
    notify('❌ Falha ao processar a foto: ' + err.message, '#d98a7c');
  }
}

function removerFotoNF() {
  fotoNFTemp = null;
  renderFotoNFPreview();
}

function renderFotoNFPreview() {
  const preview = document.getElementById('nf-foto-preview');
  const img = document.getElementById('nf-foto-img');
  const btn = document.getElementById('nf-foto-btn');
  if (fotoNFTemp) {
    img.src = fotoNFTemp;
    preview.style.display = 'block';
    btn.textContent = '📷 TROCAR FOTO';
  } else {
    preview.style.display = 'none';
    btn.textContent = '📷 FOTOGRAFAR NOTA';
  }
}

function notify(msg, cor = '#7cb083') {
  const n = document.getElementById('notif');
  n.textContent = msg;
  n.style.background = cor;
  n.classList.add('show');
  setTimeout(() => n.classList.remove('show'), 3000);
}

function voltarParaHome() {
  try {
    if (parent && parent.switchTab && parent !== window) {
      parent.switchTab('home');
    } else {
      window.location.href = 'buildly-completo.html';
    }
  } catch (e) {
    window.location.href = 'buildly-completo.html';
  }
}

function formatarMoeda(valor) {
  return 'R$ ' + valor.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
}

// Calcular total do item
document.addEventListener('input', function(e) {
  if (e.target.id === 'item-quantidade' || e.target.id === 'item-preco-unit') {
    const qtd = parseFloat(document.getElementById('item-quantidade').value) || 0;
    const preco = parseFloat(document.getElementById('item-preco-unit').value) || 0;
    const total = qtd * preco;
    document.getElementById('item-total').value = total.toFixed(2);
  }
});

function adicionarItem() {
  const descricao = document.getElementById('item-descricao').value.trim();
  const quantidade = parseFloat(document.getElementById('item-quantidade').value) || 0;
  const preco_unitario = parseFloat(document.getElementById('item-preco-unit').value) || 0;
  const total = quantidade * preco_unitario;

  if (!descricao || quantidade === 0 || preco_unitario === 0) {
    notify('❌ Preencha descrição, quantidade e preço', '#d98a7c');
    return;
  }

  itensTemp.push({
    id: Date.now(),
    descricao,
    quantidade,
    preco_unitario,
    total
  });

  document.getElementById('item-descricao').value = '';
  document.getElementById('item-quantidade').value = '';
  document.getElementById('item-preco-unit').value = '';
  document.getElementById('item-total').value = '';

  renderItensTemp();
  atualizarTotalNF();
  notify('✅ Item adicionado!');
}

function renderItensTemp() {
  const html = itensTemp.length ? itensTemp.map((item, idx) => `
    <div class="item-row">
      <div class="item-row-header">
        <div>
          <div class="item-row-title">${item.descricao}</div>
          <div style="font-size:11px;color:#fff">
            ${item.quantidade} × R$ ${item.preco_unitario.toFixed(2)} = ${formatarMoeda(item.total)}
          </div>
        </div>
        <div class="item-row-actions">
          <button onclick="removerItem(${idx})">🗑️</button>
        </div>
      </div>
    </div>
  `).join('') : '<p style="color:#fff;font-size:12px">Nenhum item adicionado ainda</p>';

  document.getElementById('lista-itens-novo').innerHTML = html;
}

function removerItem(idx) {
  itensTemp.splice(idx, 1);
  renderItensTemp();
  atualizarTotalNF();
}

function atualizarTotalNF() {
  const total = itensTemp.reduce((s, i) => s + i.total, 0);
  document.getElementById('total-nf').textContent = formatarMoeda(total);
}

function salvarNotaFiscal() {
  const numero = document.getElementById('nf-numero').value.trim();
  const serie = document.getElementById('nf-serie').value.trim();
  const data = document.getElementById('nf-data').value;
  const fornecedor = document.getElementById('nf-fornecedor').value.trim();
  const categoria = document.getElementById('nf-categoria').value;
  const responsavel = document.getElementById('nf-responsavel').value;
  const observacoes = document.getElementById('nf-observacoes').value.trim();

  if (!numero || !data || !fornecedor || itensTemp.length === 0) {
    notify('❌ Preencha NF, data, fornecedor e adicione itens', '#d98a7c');
    return;
  }

  const total_nf = itensTemp.reduce((s, i) => s + i.total, 0);

  const nf = {
    id: Date.now(),
    numero,
    serie,
    data,
    fornecedor,
    categoria,
    responsavel,
    observacoes,
    itens: [...itensTemp],
    total_nf,
    foto: fotoNFTemp || null,
    criado_em: new Date().toISOString()
  };

  notasFiscais.push(nf);
  try {
    S.set('notasfiscais', notasFiscais);
  } catch (err) {
    notasFiscais.pop();
    notify('❌ Sem espaço para salvar (foto muito pesada?). Tente sem foto ou apague notas antigas.', '#d98a7c');
    return;
  }

  document.getElementById('nf-numero').value = '';
  document.getElementById('nf-serie').value = '';
  document.getElementById('nf-data').value = '';
  document.getElementById('nf-fornecedor').value = '';
  document.getElementById('nf-observacoes').value = '';
  itensTemp = [];
  fotoNFTemp = null;
  renderFotoNFPreview();
  renderItensTemp();
  atualizarTotalNF();

  notify('✅ Nota Fiscal salva com sucesso!', '#7cb083');
}

function renderListar() {
  const categoria = document.getElementById('filtro-categoria').value;
  const periodo = document.getElementById('filtro-periodo').value;
  const hoje = new Date();
  const mesAtual = new Date(hoje.getFullYear(), hoje.getMonth(), 1);
  const semanaPassa = new Date(hoje.getTime() - 7*24*60*60*1000);

  let filtradas = notasFiscais.filter(nf => {
    if (categoria && nf.categoria !== categoria) return false;
    const dataNF = new Date(nf.data);
    if (periodo === 'mes' && dataNF < mesAtual) return false;
    if (periodo === 'semana' && dataNF < semanaPassa) return false;
    return true;
  }).sort((a, b) => new Date(b.data) - new Date(a.data));

  const html = filtradas.length ? filtradas.map(nf => `
    <div class="card">
      <div class="card-title">NF ${nf.numero}${nf.serie ? '/' + nf.serie : ''} - ${nf.fornecedor}</div>
      <div class="card-desc">${new Date(nf.data).toLocaleDateString('pt-BR')}</div>
      <div class="card-meta">
        <span class="badge badge-blue">${nf.categoria}</span>
        <span class="badge badge-green">${nf.responsavel}</span>
      </div>
      ${nf.foto ? `
      <a href="${nf.foto}" target="_blank" rel="noopener">
        <img src="${nf.foto}" alt="Foto da nota"
          style="width:64px;height:64px;object-fit:cover;border-radius:6px;border:1.5px solid var(--line);margin-top:8px;display:block"/>
      </a>` : ''}
      <div style="margin-top:8px;font-size:12px;color:#fff">
        <strong>${nf.itens.length} item(ns):</strong><br>
        ${nf.itens.map(i => `• ${i.descricao} (${i.quantidade} × R$ ${i.preco_unitario.toFixed(2)})`).join('<br>')}
      </div>
      <div class="card-footer">
        <span>${formatarMoeda(nf.total_nf)}</span>
        <button onclick="deletarNF(${nf.id})" style="background:none;border:none;color:#d98a7c;cursor:pointer;font-weight:700">🗑️ DELETAR</button>
      </div>
    </div>
  `).join('') : '<p style="color:#fff">Nenhuma nota fiscal</p>';

  document.getElementById('lista-nfs').innerHTML = html;
}

function renderResumo() {
  const total = notasFiscais.reduce((s, nf) => s + nf.total_nf, 0);
  document.getElementById('total-geral').textContent = formatarMoeda(total);

  const porCategoria = {};
  const porFornecedor = {};

  notasFiscais.forEach(nf => {
    porCategoria[nf.categoria] = (porCategoria[nf.categoria] || 0) + nf.total_nf;
    porFornecedor[nf.fornecedor] = (porFornecedor[nf.fornecedor] || 0) + nf.total_nf;
  });

  const catHtml = Object.entries(porCategoria)
    .sort((a, b) => b[1] - a[1])
    .map(([cat, valor]) => `
      <div class="stat-box">
        <div class="stat-label">${cat}</div>
        <div style="font-family:var(--serif);font-size:18px;font-weight:700;color:var(--accent)">${formatarMoeda(valor)}</div>
        <div style="font-size:11px;color:#fff;margin-top:4px">${((valor/total)*100).toFixed(1)}% do total</div>
      </div>
    `).join('');

  const fornHtml = '<div style="margin-top:20px"><div class="sec-title">Top Fornecedores</div>' +
    Object.entries(porFornecedor)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 5)
    .map(([forn, valor]) => `
      <div class="stat-box">
        <div class="stat-label">${forn}</div>
        <div style="font-family:var(--serif);font-size:16px;font-weight:700;color:var(--accent)">${formatarMoeda(valor)}</div>
      </div>
    `).join('') + '</div>';

  document.getElementById('resumo-categorias').innerHTML = catHtml;
  document.getElementById('resumo-fornecedores').innerHTML = fornHtml;
}

function deletarNF(id) {
  if (confirm('Deletar esta nota fiscal?')) {
    notasFiscais = notasFiscais.filter(nf => nf.id !== id);
    S.set('notasfiscais', notasFiscais);
    renderListar();
    renderResumo();
  }
}

function atualizarSelectsCategorias() {
  [document.getElementById('nf-categoria'), document.getElementById('filtro-categoria')].forEach(sel => {
    const val = sel.value;
    sel.innerHTML = '<option value="">Todas</option>' + categorias.map(c => `<option value="${c}">${c}</option>`).join('');
    sel.value = val;
  });
}

function atualizarSelectsResponsaveis() {
  document.getElementById('nf-responsavel').innerHTML = responsaveis.map(r => `<option value="${r}">${r}</option>`).join('');
}

function abrir(tab, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + tab).classList.add('active');
  el.classList.add('active');

  if (tab === 'listar') renderListar();
  else if (tab === 'resumo') renderResumo();
}

function abrirConfig() {
  document.getElementById('cfg-obra').value = config.obra;
  document.getElementById('cfg-responsavel').value = config.responsavel;
  document.getElementById('modal-config').classList.add('open');
}

function fecharConfig() {
  document.getElementById('modal-config').classList.remove('open');
}

function salvarConfig() {
  config.obra = document.getElementById('cfg-obra').value;
  config.responsavel = document.getElementById('cfg-responsavel').value;
  S.set('config', config);
  fecharConfig();
  notify('✅ Configurações salvas!');
}

// Init
window.addEventListener('load', () => {
  const agora = new Date();
  document.getElementById('hdr-date').textContent = agora.toLocaleDateString('pt-BR', {weekday:'short',day:'2-digit',month:'short'});
  document.getElementById('nf-data').valueAsDate = agora;
  atualizarSelectsCategorias();
  atualizarSelectsResponsaveis();
});
</script>
</body>
</html>
